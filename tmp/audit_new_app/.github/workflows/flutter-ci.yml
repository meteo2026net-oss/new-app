name: Flutter CI Workflow

on:
  push:
    branches: [ main, refactor/project-structure ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd flutter_app
          flutter pub get
      - name: Analyze Flutter Code
        run: |
          cd flutter_app
          flutter analyze
      - name: Run Flutter Tests
        run: |
          cd flutter_app
          flutter test
